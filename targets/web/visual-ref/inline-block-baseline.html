<!doctype html><meta charset=utf-8>
<style>
  body { margin:0; font: 16px/1.2 sans-serif; }
  .ibox { width:200px; }
  .ibox span { display:inline-block; background:#39f; }
  #s1 { width:40px; height:12px; }
  #s2 { width:60px; height:10px; background:#f93; }
</style>
<div class="ibox"><span id="s1"></span><span id="s2"></span></div>
<pre id="out"></pre>
<script>
  const p = document.querySelector('.ibox').getBoundingClientRect();
  const r = id => { const b = document.getElementById(id).getBoundingClientRect();
                    return `${id}=(${b.x-p.x},${b.y-p.y} ${b.width}x${b.height})`; };
  document.getElementById('out').textContent = r('s1') + '  ' + r('s2');
</script>
